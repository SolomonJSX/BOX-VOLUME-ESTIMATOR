[project]
name = "box-volume-estimator"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "gradio>=6.26.0",
    "numpy>=2.4.6",
    "open3d>=0.19.0",
    "opencv-python>=5.0.0.93",
    "pillow>=12.3.0",
    "pydantic-settings>=2.15.0",
    "rich>=15.0.0",
    "scipy>=1.17.1",
    "supervision>=0.30.1",
    "timm>=1.0.28",
    "torch>=2.13.0",
    "torchaudio>=2.11.0",
    "torchvision>=0.28.0",
    "transformers>=5.15.1",
    "trimesh>=5.0.0",
    "typer>=0.27.1",
    "ultralytics>=8.4.126",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "integration: тесты с реальным инференсом и загрузкой весов",
]
